<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boutique Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>My Boutique Shopping</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#products">Products</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section class="hero">
    <h2>New Fashion Collection</h2>
    <p>Trendy | Elegant | Affordable</p>
</section>

<section id="products" class="products">
    <h2>Our Products</h2>

    <div class="product">
        <img src="https://via.placeholder.com/200" alt="Dress">
        <h3>Stylish Dress</h3>
        <p>₹1499</p>
        <button onclick="addToCart('Stylish Dress')">Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200" alt="Top">
        <h3>Casual Top</h3>
        <p>₹799</p>
        <button onclick="addToCart('Casual Top')">Add to Cart</button>
    </div>

</section>

<section id="contact" class="contact">
    <h2>Contact Us</h2>
    <p>Email: boutique@email.com</p>
</section>

<footer>
    <p>© 2026 My Boutique</p>
</footer>

<script src="script.js"></script>
</body>
</html>
