
# ==========================================
# GitLab CI/CD - myfirstpipeline
# Runner: gst-runner
# Deployment: GSTSRV1 (192.168.100.51)
# Application port: 8080
# ==========================================

stages:
  - validate
  - build
  - deploy

variables:
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE"

# ==========================================
# STAGE 1: VALIDATE SOURCE CODE
# ==========================================

validate:
  stage: validate
  image: alpine:latest
  tags:
    - gst-runner
  script:
    - echo "Starting source validation..."
    - test -f index.html
    - test -f script.js
    - test -f style.css
    - test -f Dockerfile
    - echo "All required files are present."
    - echo "Validation successful!"

# ==========================================
# STAGE 2: BUILD AND PUSH DOCKER IMAGE
# ==========================================

build:
  stage: build
  image: docker:27-cli
  tags:
    - gst-runner
  script:
    - echo "Checking Docker connectivity..."
    - docker version
    - echo "Logging into GitLab Container Registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - echo "Building Docker image..."
    - docker build -t "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$DOCKER_IMAGE:latest" .
    - echo "Pushing versioned image..."
    - docker push "$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "Pushing latest image..."
    - docker push "$DOCKER_IMAGE:latest"
    - echo "Docker build and push completed successfully!"

# ==========================================
# STAGE 3: DEPLOY TO GSTSRV1
# ==========================================

deploy:
  stage: deploy
  image: alpine:latest
  tags:
    - gst-runner
  needs:
    - build

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

  before_script:
    - apk add --no-cache openssh-client

  script:
    - echo "Preparing SSH connection..."
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - chmod 600 "$SSH_PRIVATE_KEY"

    - echo "Connecting to deployment server..."

    - |
      ssh -i "$SSH_PRIVATE_KEY" \
        -o StrictHostKeyChecking=yes \
        "$DEPLOY_USER@$DEPLOY_HOST" \
        "IMAGE='$DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA' bash -s" <<'REMOTE'

      set -e

      echo "Pulling Docker image..."
      docker pull "$IMAGE"

      echo "Removing previous container..."
      docker rm -f myfirstpipeline 2>/dev/null || true

      echo "Starting new application container..."
      docker run -d \
        --name myfirstpipeline \
        --restart unless-stopped \
        -p 8080:80 \
        "$IMAGE"

      echo "Checking deployment..."
      docker ps --filter name=myfirstpipeline

      echo "Application deployment successful!"

      REMOTE

# ==========================================
# END OF PIPELINE
# ==========================================
